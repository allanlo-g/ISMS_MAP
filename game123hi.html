<div id="fitg" style="position:fixed;inset:0;overflow:hidden"><div id="stage">
  <div id="hud"><div class="lv" id="lv"></div><span class="nm" id="lvn"></span><span class="sp"></span><span id="clock"></span><button id="skip">跳過這關</button><button id="snd" aria-pressed="true">音效：開</button></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$("#stage"), scene=$("#scene");
function fit(){ const W=innerWidth,H=innerHeight,k=Math.min(W/1280,H/720); stage.style.transform=`translate(${(W-1280*k)/2}px,${(H-720*k)/2}px) scale(${k})`; }
addEventListener("resize",fit); fit();
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* 音效：只在使用者按下開始後建立 */
let AC=null, sound=true;
function beep(f=660,d=.08,type="square",v=.05){ if(!sound||!AC) return; try{ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
const sOk=()=>{beep(880,.07);setTimeout(()=>beep(1320,.09),70)}, sBad=()=>beep(170,.22,"sawtooth",.06), sTick=()=>beep(520,.04), sWin=()=>[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110));
$("#snd").onclick=e=>{ sound=!sound; e.currentTarget.textContent="音效："+(sound?"開":"關"); e.currentTarget.setAttribute("aria-pressed",sound); };
/* 遊戲狀態 */
const NAMES=["","沒有工具的日子","每日巡檢","資安情資","資安月報","稽核日"];
const G={lv:0,l1:{ok:0,miss:0},l2:{sec:0},l3:{sec:0,in:[],out:0},l5:{first:0}};
let timers=[], raf=0, clockT0=0, clockOn=false, skipFn=null;
const later=(fn,ms)=>{ const id=setTimeout(fn,RM?Math.min(ms,60):ms); timers.push(id); return id; };
function clear(){ timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(raf); clockOn=false; $("#clock").textContent=""; scene.innerHTML=""; skipFn=null; }
function hud(){ $("#lv").innerHTML=[1,2,3,4,5].map(i=>`<i class="${i<G.lv?"done":i===G.lv?"on":""}"></i>`).join(""); $("#lvn").textContent=G.lv>=1&&G.lv<=5?`關卡 ${G.lv}　${NAMES[G.lv]}`:""; $("#skip").style.visibility=G.lv>=1&&G.lv<=5?"visible":"hidden"; }
function startClock(){ clockT0=performance.now(); clockOn=true; (function tick(){ if(!clockOn) return; $("#clock").textContent=((performance.now()-clockT0)/1000).toFixed(1)+" 秒"; requestAnimationFrame(tick); })(); }
const stopClock=()=>{ clockOn=false; return Math.round((performance.now()-clockT0)/100)/10; };

const LEVELS=[intro,l1,l2,l3,l4,l5,ending];

/* ---------- 關卡 1：補紀錄 ---------- */
function l1(){

  const DUR=16; G.l1={ok:0,miss:0};
  scene.innerHTML=`<div id="l1" style="position:absolute;inset:0"><div class="title"><small>關卡 1</small>稽核前，補紀錄</div>
    <div class="bar"><i id="l1b"></i></div><div class="bl">距離稽核</div>
    <div class="floor"><span id="l1m">缺漏 0 張</span></div>
    <div class="tip" style="bottom:86px">空白紀錄不斷掉下來，<b>點它</b>就能補一張。撐到稽核那天。</div></div>`;
  const box=$("#l1"); let t0=performance.now(), lastSpawn=0, n=0, live=[], over=false;
  function spawn(){ const d=DOCS[n++%DOCS.length], e=document.createElement("div"); e.className="doc"; e.innerHTML=`${d[0]}<small>${d[1]}</small>`; const x=40+Math.random()*1050; e.style.left=x+"px"; e.style.top="-90px"; box.appendChild(e);
    const o={e,y:-90,x,done:false}; live.push(o); e.onpointerdown=()=>{ if(o.done||over) return; o.done=true; G.l1.ok++; e.classList.add("ok"); sOk(); later(()=>e.remove(),520); }; }
  function finish(){ if(over) return; over=true; cancelAnimationFrame(raf); sBad();
    result(`<div class="h2">稽核到了。</div><div class="row"><div><b>${G.l1.ok}</b>張補完</div><div><b style="color:var(--red)">${G.l1.miss}</b>張缺漏</div></div>
      <div class="p" style="max-width:760px">而且補出來的紀錄，日期和實際作業對不起來。<br>問題不在你手不夠快，而是<b style="color:#fff">平常沒有一個地方告訴你今天該做什麼</b>。</div>`,"換個方法",()=>go(2)); }
  skipFn=()=>{ G.l1.miss=Math.max(G.l1.miss,9); finish(); };
  let prev=t0; (function loop(now){ if(over) return; const el=(now-t0)/1000, dt=Math.min(.05,(now-prev)/1000); prev=now; const p=Math.min(1,el/DUR);
    $("#l1b").style.width=(1-p)*100+"%";
    const gap=RM?900:900-600*p, sp=RM?120:150+230*p;
    if(now-lastSpawn>gap){ lastSpawn=now; spawn(); if(p>.55&&!RM) spawn(); }
    live.forEach(o=>{ if(o.done) return; o.y+=sp*dt; o.e.style.top=o.y+"px"; if(o.y>505){ o.done=true; G.l1.miss++; o.e.classList.add("miss"); o.e.style.top=(520+Math.random()*24)+"px"; o.e.style.transform=`rotate(${(Math.random()*24-12).toFixed(0)}deg)`; $("#l1m").textContent=`缺漏 ${G.l1.miss} 張`; $("#l1m").parentElement.classList.remove("shake"); void box.offsetWidth; $("#l1m").parentElement.classList.add("shake"); beep(200,.06,"sawtooth",.03); } });
    if(el>=DUR) return finish(); raf=requestAnimationFrame(loop); })(t0);
}

      ${ITEMS.map((n,i)=>`<div class="ck ${st[i]?(d===2&&i===6&&ups==="ng"?"n":"y"):""}" data-i="${i}" role="checkbox" aria-checked="${!!st[i]}" tabindex="0"><i>${st[i]?(d===2&&i===6&&ups==="ng"?"!":"✓"):""}</i>${n}<em>${["IS-P-02-007","IS-P-02-007","IS-P-02-007","IS-P-03-005","IS-P-02-007","IS-P-02-006","機關規定"][i]}</em></div>`).join("")}
      ${d===2?`<div class="ups"><span>機房日誌：UPS 不斷電系統</span><span class="seg"><button data-u="ok" class="${ups==="ok"?"ony":""}">正常</button><button data-u="ng" class="${ups==="ng"?"onn":""}">不正常</button></span><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="fix" ${fix?"checked":""} style="width:22px;height:22px"> 已叫修</label></div>`:""}`;
    const day=$(`#l2 .day[data-d="${d}"]`); [...day.querySelectorAll("i")].forEach((x,i)=>{ x.className=st[i]?(d===2&&i===6&&ups==="ng"?"n":"y"):""; });

    $$("#tdy [data-u]").forEach(b=>b.onclick=()=>{ ups=b.dataset.u; if(ups==="ok"){ sBad(); tip("今天 UPS 的<b>電池告警燈亮了</b>，不能勾正常。"); } else { sTick(); tip("很好。再勾<b>已叫修</b>，這筆異常就會跟著月報一起呈報。"); } draw(); });

  function finish(){ G.l2.sec=stopClock(); sWin(); result(`<div class="h2">一週巡檢，完成。</div><div class="row"><div><b>${G.l2.sec}</b>秒</div><div><b>35</b>筆巡檢紀錄</div><div><b style="color:var(--amber)">1</b>筆異常已留紀錄</div></div>

  function sA(){ side.innerHTML=`<div class="card ic fadein"><div class="src">資安情資　115 年 11 月</div><h4>情資表這個月又更新了。</h4><div class="hint">以前要一則一則複製到情資管理表。現在只要按一下。</div></div><button class="btn pulse" id="sync">同步情資表</button>`; tip("按<b>「同步情資表」</b>，把這個月的情資讀進來。");

    set(N,N,0,0,KEV); sOk(); later(sC,RM?600:2200); }
  function sC(){ const f=FEAT[fi]; const ti=fi<2?tiles[fi]:tiles[KEV+HIT]; tiles.forEach(t=>t.e.classList.remove("cur")); ti.e.classList.add("cur");

  let signed=0;
  function done(){ sWin(); result(`<div class="h2">月報完成，可以呈核了。</div><div class="p" style="max-width:760px">你沒有填任何一個數字。巡檢天數、異常、情資件數，都是<b style="color:#fff">平常做的時候</b>就記下來的。<br>平常有做，月底就只剩列印和簽名。</div>`,"最後一關：稽核日",()=>go(5)); }
  $("#gen").onclick=()=>{ sOk(); $("#gen").disabled=true; $("#gen").classList.remove("pulse"); const vs=$$("#l4 td.v"); vs.forEach((e,i)=>later(()=>{ e.textContent=e.dataset.v; e.classList.add("fadein"); sTick(); if(i===vs.length-1) later(()=>{ $("#l4t").innerHTML="最後一步：點<b>承辦人</b>和<b>主管審查</b>兩格蓋章。"; $$("#l4 .sg").forEach(s=>{ s.classList.add("wait"); s.tabIndex=0; const f=()=>{ if(s.dataset.ok) return; s.dataset.ok=1; s.classList.remove("wait"); s.querySelector(".seal").classList.add("on"); beep(140,.12,"square",.08); signed++; if(signed===2) later(done,700); }; s.onclick=f; s.onkeydown=k=>{ if(k.key==="Enter"||k.key===" "){ k.preventDefault(); f(); } }; }); },400); },300+i*230)); };
  skipFn=()=>go(5);
}

/* ---------- 關卡 5：稽核日 ---------- */
function l5(){
  const TABS=[["month","本月工作","每日巡檢、每月工作清單"],["room","機房日誌","每天的機房工作日誌"],["cti","資安情資","情資分流與 IS-P-04-052"],["kpi","KPI 量測","27 項量測逐月累計"]];
  const QS=[{q:"請出示這個月的每日巡檢紀錄。",a:"month",ev:"<b>找到了。</b>本月工作頁的巡檢月曆：星期一到五每天 7 項，共 35 筆，是你在關卡 2 一筆一筆點出來的。"},
    {q:"11 月的資安情資管理表，有經過篩選嗎？",a:"cti",ev:`<b>找到了。</b>IS-P-04-052，紀錄編號 P-R-052-261130-01：蒐集 84 則、納入 ${G.l3.in.length} 則、不適用 ${G.l3.out} 則，每一則被排除的理由都在篩選紀錄裡。`},
    {q:"我看到月報寫 UPS 異常 1 件，後來怎麼處理？",a:"room",ev:"<b>找到了。</b>星期三的機房工作日誌：UPS 不斷電系統標示不正常、已叫修，待修紀錄表寫了維護廠商與處理情況。"}];
  let qi=0, t0=0, first=0, tried=false, locked=false; const LIM=12;
  scene.innerHTML=`<div id="l5" style="position:absolute;inset:0"><div class="card aud"><div class="face">稽</div><div class="q"><small id="qn"></small><span id="qq"></span></div></div><div class="tb"><i id="tbi"></i></div>
    <div class="tabs">${TABS.map(([k,n,s])=>`<button class="tab" data-k="${k}">${n}<small>${s}</small></button>`).join("")}</div><div class="card ev" id="ev" style="visibility:hidden"></div><div class="tip" id="l5t">稽核員問什麼，就點<b>對的頁籤</b>把紀錄調出來。</div></div>`;
  function ask(){ const Q=QS[qi]; locked=false; tried=false; $("#qn").textContent=`稽核員　第 ${qi+1}／3 題`; $("#qq").textContent=Q.q; $("#ev").style.visibility="hidden"; $$("#l5 .tab").forEach(b=>b.className="tab"); t0=performance.now(); sTick();
    cancelAnimationFrame(raf); (function tk(now){ if(locked) return; const p=Math.min(1,(now-t0)/1000/LIM); $("#tbi").style.width=(1-p)*100+"%"; if(p>=1){ $("#l5t").innerHTML="不急，沒有扣分。想想這筆紀錄是在<b>哪一關</b>留下的。"; return; } raf=requestAnimationFrame(tk); })(t0); }
  $$("#l5 .tab").forEach(b=>b.onclick=()=>{ if(locked) return; const Q=QS[qi]; if(b.dataset.k!==Q.a){ tried=true; b.classList.add("no","shake"); sBad(); later(()=>b.classList.remove("shake"),320); return; }
    locked=true; if(!tried) first++; b.classList.add("ok"); sOk(); const ev=$("#ev"); ev.innerHTML=Q.ev+`<div style="text-align:right;margin-top:8px"><button class="btn sm pulse" id="l5n">${qi<2?"下一題":"看稽核結果"}</button></div>`; ev.style.visibility="visible"; ev.classList.remove("fadein"); void ev.offsetWidth; ev.classList.add("fadein");
    $("#l5n").onclick=()=>{ if(qi<2){ qi++; ask(); } else { G.l5.first=first; go(6); } }; $("#l5n").focus(); });
  skipFn=()=>{ G.l5.first=first; go(6); };
  ask();
}

/* ---------- 結局 ---------- */
function ending(){
  sWin();
  scene.innerHTML=`<div class="center end fadein" style="gap:14px"><div class="p" style="color:var(--amber);font-weight:700;letter-spacing:.1em">稽核結果</div>
    <div class="h1" style="font-size:58px">不只為了驗證。<br><span style="color:var(--amber)">讓 ISMS 成為日常。</span></div>
    <div class="res" style="position:static;background:none;padding:0"><div class="row"><div><b style="color:var(--red)">${G.l1.miss}</b>關卡 1 的缺漏紀錄</div><div><b>0</b>換方法後的缺漏</div><div><b>${G.l3.sec||"—"}</b>秒分流 84 則情資</div><div><b>${G.l5.first}／3</b>稽核提問一次答對</div></div></div>
    <ul><li>每日、每週、每月、每季、半年、每年的工作，依頻率排好</li><li>每一項工作都標明依據與表單</li><li>機房工作日誌線上填寫，照原表單列印</li><li>資安情資同步、初篩、判斷、列印一次完成</li><li>月報與量測自動帶入，列印即可簽核</li><li>單一網頁檔，免安裝，資料留在機關自己的電腦</li></ul>
    <div style="display:flex;gap:16px;margin-top:10px"><button class="btn" id="again">再玩一次</button><a class="btn ghost" href="https://www.123hi.org" target="_blank" rel="noopener" style="text-decoration:none">www.123hi.org</a></div>
    <div class="p" style="font-size:16px">ISMS 工作地圖　系統設計：Allan Lo</div></div>`;
  $("#again").onclick=()=>{ G.l1={ok:0,miss:0}; G.l2={sec:0}; G.l3={sec:0,in:[],out:0}; G.l5={first:0}; go(0); };
}
go(0);
</script></body></html>
